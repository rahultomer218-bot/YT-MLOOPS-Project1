<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Predict Karo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 36px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #a8a8b3;
            margin-bottom: 40px;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #a8a8b3;
            font-size: 13px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px 16px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #e94560;
        }

        .form-group select option {
            background: #1a1a2e;
            color: white;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(to right, #e94560, #c62a47);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 32px;
            transition: opacity 0.3s;
            display: block;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .result-card {
            background: linear-gradient(135deg, #e94560, #c62a47);
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-top: 32px;
        }

        .result-card h2 {
            color: white;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .result-card .price {
            color: white;
            font-size: 48px;
            font-weight: bold;
        }

        .back-btn {
            display: block;
            text-align: center;
            color: #a8a8b3;
            text-decoration: none;
            margin-top: 24px;
            font-size: 15px;
        }

        .back-btn:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Vehicle Details Bharo</h1>
        <p class="subtitle">Apni gaadi ki details bharke price jaano</p>

        <div class="form-card">
            <form action="/predict" method="POST">
                <div class="form-grid">

                    <div class="form-group">
                        <label>Brand (Make)</label>
                        <input type="text" name="make" placeholder="e.g. Honda, Toyota" required>
                    </div>

                    <div class="form-group">
                        <label>Model</label>
                        <input type="text" name="model" placeholder="e.g. City, Innova" required>
                    </div>

                    <div class="form-group">
                        <label>Year</label>
                        <input type="number" name="year" placeholder="e.g. 2020" min="2000" max="2026" required>
                    </div>

                    <div class="form-group">
                        <label>Vehicle Type</label>
                        <select name="vehicle_type" required>
                            <option value="">-- Select --</option>
                            <option value="Sedan">Sedan</option>
                            <option value="SUV">SUV</option>
                            <option value="Compact SUV">Compact SUV</option>
                            <option value="Hatchback">Hatchback</option>
                            <option value="Motorcycle">Motorcycle</option>
                            <option value="Truck">Truck</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Fuel Type</label>
                        <select name="fuel_type" required>
                            <option value="">-- Select --</option>
                            <option value="Petrol">Petrol</option>
                            <option value="Diesel">Diesel</option>
                            <option value="Electric">Electric</option>
                            <option value="CNG">CNG</option>
                            <option value="Hybrid">Hybrid</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Transmission</label>
                        <select name="transmission" required>
                            <option value="">-- Select --</option>
                            <option value="Manual">Manual</option>
                            <option value="Automatic">Automatic</option>
                            <option value="CVT">CVT</option>
                            <option value="AMT">AMT</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Mileage (kmpl)</label>
                        <input type="number" name="mileage_kmpl" placeholder="e.g. 18.5" step="0.1" required>
                    </div>

                    <div class="form-group">
                        <label>Engine (CC)</label>
                        <input type="number" name="engine_cc" placeholder="e.g. 1500" required>
                    </div>

                    <div class="form-group">
                        <label>Max Power (BHP)</label>
                        <input type="number" name="max_power_bhp" placeholder="e.g. 120" step="0.1" required>
                    </div>

                    <div class="form-group">
                        <label>Seats</label>
                        <input type="number" name="seats" placeholder="e.g. 5" min="2" max="10" required>
                    </div>

                    <div class="form-group">
                        <label>Age (Years)</label>
                        <input type="number" name="age_years" placeholder="e.g. 3" min="0" max="30" required>
                    </div>

                </div>

                <!-- Submit Button form-grid ke BAHAR hai -->
                <button type="submit" class="btn-submit">
                    🔍 Price Predict Karo
                </button>

            </form>

            {% if predicted_price %}
            <div class="result-card">
                <h2>🎯 Aapki Gaadi Ki Estimated Price:</h2>
                <div class="price">{{ predicted_price }}</div>
            </div>
            {% endif %}

        </div>

        <a href="/" class="back-btn">← Home par Wapas Jao</a>
    </div>
</body>
</html>
